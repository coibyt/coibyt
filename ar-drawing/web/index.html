<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /path/` -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TraceLight – trace any picture onto paper through your phone camera.">
  <!-- Private test build: keep it out of search engines until launch. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14161F">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TraceLight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TraceLight</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #14161F; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font: 600 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #f2efe8;
      transition: opacity .3s;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .bar { width: 140px; height: 4px; border-radius: 2px; background: #2a2e3d; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #FFB547; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>TraceLight</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // Remove the loading screen once Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 350); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
