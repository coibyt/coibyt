# Nightly job: writes tomorrow's lesson, builds the 2-hour MP3, checks it, makes the cover, uploads to Hostinger.
# NOT active yet. To enable: put this project in its own repository (recommended, so the nightly commit
# does not redeploy VaraaAi) and copy this file to .github/workflows/daily.yml there.
# Repository secrets needed: ANTHROPIC_API_KEY, MAX11_API_KEY, KIE_API_KEY,
#   HOSTINGER_SSH_KEY (private key), HOSTINGER_SSH_HOST, HOSTINGER_SSH_PORT, HOSTINGER_SSH_USER,
#   NGHE_REMOTE_DIR (e.g. domains/varaaai.com/public_html/nghe)
name: daily-lesson
on:
  schedule:
    - cron: "17 19 * * *"   # 19:17 UTC = 02:17 Vietnam time
  workflow_dispatch:
    inputs:
      date: { description: "YYYY-MM-DD (empty = next day)", required: false }
concurrency: daily-lesson
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg   # Ubuntu's ffmpeg includes rubberband
      - run: pip install -r engine/requirements.txt anthropic
      # Clip cache + SRS database survive between runs: old clips are reused for reviews (no new credits).
      - uses: actions/cache@v4
        with:
          path: |
            engine/cache
            engine/data
            web/public/days
          key: nghe-${{ github.run_id }}
          restore-keys: nghe-
      - name: Write, build, check, cover
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX11_API_KEY: ${{ secrets.MAX11_API_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
        working-directory: engine
        run: python -m nghe daily ${{ inputs.date }}
      - name: Commit the new lesson text
        run: |
          git config user.name "nghe-bot"; git config user.email "nghe-bot@users.noreply.github.com"
          git add content/days web/public/days/*/day.json web/public/days/*/*.vtt web/public/days/*/*.srt web/public/days/*/cover.jpg web/public/days/index.json
          git commit -m "Lesson $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Upload to Hostinger
        env:
          NGHE_REMOTE_DIR: ${{ secrets.NGHE_REMOTE_DIR }}
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf "Host nghe-hostinger\n  HostName %s\n  Port %s\n  User %s\n  StrictHostKeyChecking accept-new\n" \
            "${{ secrets.HOSTINGER_SSH_HOST }}" "${{ secrets.HOSTINGER_SSH_PORT }}" "${{ secrets.HOSTINGER_SSH_USER }}" > ~/.ssh/config
          bash scripts/deploy.sh
