<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- Được thay bằng giá trị của `flutter build web --base-href /duong-dan/` -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ong Vàng Toán 3 – luyện toán lớp 3 cho bé: lý thuyết, bài tập, lời giải từng bước, thi thử.">
  <meta name="theme-color" content="#FFC93C">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Toán 3">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ong Vàng Toán 3</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFF8E7; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 700 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2D3142;
      transition: opacity .3s;
    }
    #splash img { width: 112px; height: 112px; border-radius: 26px; }
    #splash .bar { width: 160px; height: 6px; border-radius: 3px; background: #FFE7A3; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #FFC93C; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>Ong Vàng Toán 3</div>
    <div class="bar"><i></i></div>
    <div style="font-weight:400;font-size:15px;color:#6b6f80">Đang mở bài học…</div>
  </div>
  <script>
    // Ẩn màn chờ khi Flutter vẽ khung hình đầu tiên.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 350); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
